[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gravetrail"
version = "0.1.0"
description = "Local, evidence-backed SQL, SAS and dbt lineage workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit==1.66.0",
  "pillow==13.0.0",
  "duckdb>=1.5,<2",
  "sqlglot>=30.23,<31",
  "networkx>=3.4,<4",
  "pydantic>=2.11,<3",
  "charset-normalizer>=3.4,<4",
  "httpx>=0.28,<1",
  "tomlkit>=0.13,<1",
  "typer>=0.16,<1",
  "mcp>=1.26,<2",
  "xlsxwriter>=3.2.9,<4",
  "resvg-py>=0.5,<0.6",
  "pyyaml>=6.0.3,<7",
  "jinja2>=3.1.6,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]
build = ["pyinstaller>=6.22,<7"]

[dependency-groups]
docs = ["mkdocs==1.6.1", "mkdocs-material==9.7.7", "pymdown-extensions==12.3"]

[tool.uv]
# Temporary, tested exception to Streamlit 1.66's Pillow<13 metadata. See SECURITY.md.
# Keep installer overrides in dependency-overrides.txt identical; remove after upstream support.
override-dependencies = ["pillow==13.0.0"]

[project.scripts]
gravetrail = "dataforge.cli:app"
gravetrail-ui = "dataforge.launcher:main"
gravetrail-build = "dataforge.build:main"
dataforge = "dataforge.cli:app"
dataforge-ui = "dataforge.launcher:main"
dataforge-build = "dataforge.build:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dataforge"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "scripts/build/hatch_assets.py"

[tool.hatch.build]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.env*", "**/secrets.toml", "**/*.duckdb*"]

[tool.hatch.build.targets.sdist]
include = ["src/**", "ui/**", "prompts/**", "tests/**", "docs/**", "scripts/**", ".streamlit/**", "app.py", "README.md", "CONTRIBUTING.md", "SECURITY.md", "/dependency-overrides.txt", "mkdocs.yml", "LICENSE", "pyproject.toml", "uv.lock", "Dockerfile", "compose.yaml", ".dockerignore", ".github/**"]
exclude = ["docs/prompts/**", "docs/plans/**", "**/KNOWLEDGE.md", "**/__pycache__/**", "**/*.pyc", "**/.env*", "**/secrets.toml", "**/*.duckdb*"]

[tool.hatch.build.targets.sdist.force-include]
".streamlit/config.toml" = ".streamlit/config.toml"
"scripts/build/hatch_assets.py" = "scripts/build/hatch_assets.py"
"scripts/build/frozen_entry.py" = "scripts/build/frozen_entry.py"
"scripts/build/build_executable.py" = "scripts/build/build_executable.py"
"scripts/build/smoke.py" = "scripts/build/smoke.py"
"scripts/build/smoke_docker.py" = "scripts/build/smoke_docker.py"
"scripts/build/windows.iss" = "scripts/build/windows.iss"
"scripts/build/windows_installer.ps1" = "scripts/build/windows_installer.ps1"
"scripts/build/sign_windows.ps1" = "scripts/build/sign_windows.ps1"
"scripts/build/smoke_installer.py" = "scripts/build/smoke_installer.py"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
