[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataforge-engineering-hub"
version = "0.1.0"
description = "Local, evidence-backed SQL and SAS lineage workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.66,<2", "duckdb>=1.5,<2", "sqlglot>=30.23,<31",
  "networkx>=3.4,<4", "pydantic>=2.11,<3", "charset-normalizer>=3.4,<4",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/dataforge"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "dataforge/prompts"

[tool.hatch.build.targets.sdist]
include = ["src/**", "ui/**", "prompts/**", "tests/**", "docs/**", "plans/**", "scripts/**", ".streamlit/**", "app.py", "README.md", "AGENTS.md", "KNOWLEDGE.md", ".kbignore", "LICENSE", "pyproject.toml", "uv.lock", "Dockerfile", ".dockerignore", ".github/**"]
exclude = ["docs/prompts/**", "docs/plans/**", "**/__pycache__/**", "**/*.pyc"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
