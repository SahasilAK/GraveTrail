<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">GraveTrail system boundaries</title>
  <desc id="desc">Streamlit calls shared local services. CLI and MCP first pass AgentService launch and workspace policy. Static parsers and independent AI extraction publish through a shared Store. Immutable source versions remain attached to evidence. Imported source is data, never executable.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#496777" stroke-width="1.5"/></marker></defs>
  <style>text{font-family:Segoe UI,Arial,sans-serif;fill:#163343}.heading{font-size:24px;font-weight:700}.label{font-size:18px;font-weight:600}.body{font-size:15px}.small{font-size:14px}.arrow{fill:none;stroke:#496777;stroke-width:2;marker-end:url(#arrow)}.box{fill:#fff;stroke:#9eb9c7;stroke-width:1.5}.ai{fill:#fff6ec;stroke:#b3743b;stroke-width:1.5}.store{fill:#e9f4f3;stroke:#5d9591;stroke-width:1.5}</style>
  <rect x="1" y="1" width="1098" height="678" rx="14" fill="#f4f8fa" stroke="#c3d4dd"/>
  <text x="35" y="43" class="heading">GraveTrail: clients, analysis and retained facts</text>
  <text x="35" y="72" class="body">Imported SQL, SAS, CSV and dbt resources remain data; bounded import preserves originals.</text>
  <g class="box"><rect x="50" y="105" width="260" height="73" rx="8"/><rect x="420" y="105" width="260" height="73" rx="8"/><rect x="790" y="105" width="260" height="73" rx="8"/></g>
  <g text-anchor="middle"><text x="180" y="135" class="label">Streamlit UI</text><text x="180" y="159" class="body">Local human session</text><text x="550" y="135" class="label">Typer CLI</text><text x="550" y="159" class="body">Explicit launch grants</text><text x="920" y="135" class="label">MCP clients</text><text x="920" y="159" class="body">stdio / guarded HTTP</text></g>
  <text x="50" y="222" class="small">LOCAL APPLICATION</text>
  <rect x="35" y="236" width="1030" height="288" rx="12" fill="#eaf0f5" stroke="#9eb9c7" stroke-dasharray="6 4"/>
  <path d="M180 178V254" class="arrow"/><path d="M550 178V219H778V254" class="arrow"/><path d="M920 178V219H778V254" class="arrow"/>
  <rect x="60" y="255" width="435" height="83" rx="8" class="box"/><text x="80" y="284" class="label">Shared domain services</text><text x="80" y="309" class="body">Import, settings, analysis, queries and exports</text>
  <rect x="595" y="255" width="435" height="83" rx="8" class="box"/><text x="615" y="284" class="label">AgentService policy boundary</text><text x="615" y="309" class="body">Launch + workspace + source + effect checks</text>
  <path d="M595 297H497" class="arrow"/><text x="545" y="279" class="small" text-anchor="middle">allowed</text>
  <path d="M200 338V378" class="arrow"/><path d="M390 338V357H810V378" class="arrow"/>
  <rect x="60" y="380" width="435" height="115" rx="8" class="box"/><text x="80" y="411" class="label">Static parser path</text><text x="80" y="438" class="body">SQL / SAS parsers; CSV and dbt project readers</text><text x="80" y="465" class="body">ParseResult → identity / schemas → publication</text>
  <rect x="595" y="380" width="435" height="115" rx="8" class="ai"/><text x="615" y="411" class="label">Independent AI path</text><text x="615" y="438" class="body">Explicit provider request; provenance checks</text><text x="615" y="465" class="body">Checked checkpoints → linking → publication</text>
  <path d="M278 495V556" class="arrow"/><path d="M812 495V556" class="arrow"/>
  <rect x="60" y="558" width="970" height="83" rx="8" class="store"/><text x="80" y="586" class="label">Store: one owning DuckDB process per home</text><text x="80" y="612" class="body">Atomic current facts + durable journals; immutable originals identified by file ID and content hash</text>
  <text x="35" y="662" class="small">AI semantics remain inferred. Detailed request/transaction ownership appears in the separate sequence.</text>
</svg>
