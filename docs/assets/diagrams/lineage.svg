  <title id="title">From source tables to reporting, with evidence</title>
  <desc id="desc">raw.customers and raw.orders feed staging.customer_orders, then mart.customer_summary. A statement record links the relationship to transform.sql lines 12 through 24. Illustrative workflow, not an application screenshot.</desc>
