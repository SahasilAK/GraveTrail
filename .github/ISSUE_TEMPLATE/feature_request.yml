name: Feature request
description: Propose a focused improvement to an engineering workflow.
title: "feat: "
body:
  - type: markdown
    attributes:
      value: |
        Describe a concrete workflow and check existing issues first. Use sanitized examples and omit credentials or confidential source.
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What are you trying to do, and where does the current behavior fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful improvement and how a user would interact with it.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How to verify the improvement
      description: Give a concrete example of a successful outcome, including evidence or uncertainty that must be retained.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints
      description: Include current workarounds and any compatibility, resource, privacy or deployment constraints.
