name: Publish standalone release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact X.Y.Z version (optional; overrides release_type)'
        required: false
        type: string
      release_type:
        description: 'Bump from the highest published stable release (first base: 0.0.0)'
        type: choice
        options: [patch, minor, major]
        default: patch
      release_mode:
        description: 'Unsigned needs no certificate; production requires configured signing (development is a legacy unsigned alias)'
        type: choice
        options: [unsigned, development, production]
        default: unsigned
      dry_run:
        description: 'Verify final downloads and release notes without creating a tag or public release (branch-safe)'
        type: boolean
        default: true
      copilot_notes:
        description: 'Try Copilot highlights using GITHUB_TOKEN; fall back if unavailable (uses Copilot credits)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-standalone-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.release_mode == 'production' && 'windows-production' || 'windows-development' }}
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      build_mode: ${{ steps.policy.outputs.build_mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.5'
          python-version: '3.11'
      - name: Validate release mode, source and signing setup
        id: policy
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          DRY_RUN: ${{ inputs.dry_run }}
          WINDOWS_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
          WINDOWS_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
        run: |
          case "$RELEASE_MODE" in
            unsigned|development) BUILD_MODE=development ;;
            production) BUILD_MODE=production ;;
            *) echo "::error::Unknown release mode. Choose unsigned or production."; exit 1 ;;
          esac
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" && ( "$DRY_RUN" != "true" || "$RELEASE_MODE" == "production" ) ]]; then
            echo "::error::Public releases and production signing require the default branch: $DEFAULT_BRANCH"
            exit 1
          fi
          if [[ "$BUILD_MODE" == "production" ]]; then
            missing=()
            for variable in WINDOWS_SIGNING_THUMBPRINT WINDOWS_TIMESTAMP_URL WINDOWS_PUBLISHER; do
              if [[ -z "${!variable:-}" ]]; then missing+=("$variable"); fi
            done
            if (( ${#missing[@]} )); then
              echo "::error::Signed production releases need signing configuration in Settings > Environments > windows-production. Missing: ${missing[*]}. Choose release_mode=unsigned to build without a certificate, or follow docs/BUILD_AND_RELEASE.md to configure signing."
              exit 1
            fi
          else
            echo 'Unsigned release selected. No signing certificate or dedicated signing runner is required.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "build_mode=$BUILD_MODE" >> "$GITHUB_OUTPUT"
      - name: Resolve release version and validate unused tag
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          uv lock --check
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --slurp > release-pages.json
          jq 'add' release-pages.json > releases.json
          VERSION=$(uv run --locked python scripts/release.py resolve --releases releases.json --exact "$RELEASE_VERSION" --bump "$RELEASE_TYPE")
          TAG="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "::error::Tag $TAG already exists; releases are never overwritten"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Record source and bounded commit history
        run: |
          mkdir notes
          PREVIOUS=$(git describe --tags --match 'v[0-9]*' --abbrev=0 "$GITHUB_SHA" 2>/dev/null || true)
          RANGE="$GITHUB_SHA"
          if [[ -n "$PREVIOUS" ]]; then RANGE="$PREVIOUS..$GITHUB_SHA"; fi
          printf 'Source commit: `%s`\n\nUp to 100 commits since the previous reachable version tag.\n\n' "$GITHUB_SHA" > notes/commits.md
          git log --max-count=100 --format='- %h %s' "$RANGE" >> notes/commits.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-note-inputs
          path: notes/commits.md
          if-no-files-found: error

  builds:
    needs: prepare
    uses: ./.github/workflows/release.yml
    with:
      skip_container: true
      only_windows: true
      release_version: ${{ needs.prepare.outputs.version }}
      release_mode: ${{ needs.prepare.outputs.build_mode }}

  highlights:
    if: inputs.copilot_notes
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.5'
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-note-inputs
          path: notes
      - name: Install pinned Copilot CLI
        run: npm install --global @github/copilot@1.0.98
      - name: Optional highlights with no tool or repository access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked python scripts/release.py summarize --commits notes/commits.md --output notes/highlights.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-highlights
          path: notes/highlights.md
          if-no-files-found: ignore

  publish:
    # An unavailable/disabled Copilot job must not block verified native builds.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.builds.result == 'success' }}
    needs: [prepare, builds, highlights]
    runs-on: windows-latest
    timeout-minutes: 30
    environment: ${{ inputs.release_mode == 'production' && 'windows-production' || 'windows-development' }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_REPO: ${{ github.repository }}
      RELEASE_MODE: ${{ needs.prepare.outputs.build_mode }}
      WINDOWS_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.5'
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gravetrail-Windows-X64
          path: downloaded/gravetrail-Windows-X64
      - name: Verify downloaded builds and assemble Windows release assets
        run: uv run --locked python scripts/release.py stage "$RELEASE_VERSION" --downloads downloaded/gravetrail-Windows-X64 --output release-assets --windows-only --mode "$RELEASE_MODE" --source-revision "$GITHUB_SHA"
      - name: Install and verify exact downloaded installer and installed payload
        run: uv run --locked python scripts/build/smoke_installer.py --directory release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-note-inputs
          path: notes
      - name: Download optional Copilot highlights
        if: needs.highlights.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-highlights
          path: notes
      - name: Generate GitHub notes and retain exact change records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" --jq .body > notes/github.md
          uv run --locked python scripts/release.py notes --baseline notes/github.md --commits notes/commits.md --summary notes/highlights.md --output notes/release.md --mode "$RELEASE_MODE"
      - name: Retain verified assets and notes for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-windows-release
          path: |
            release-assets/*
            notes/release.md
          if-no-files-found: error
      - name: Record validation-only result
        if: inputs.dry_run
        run: printf 'Validated Windows release %s from `%s`; no tag or public release created.\n' "$RELEASE_TAG" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Create exact source tag and publish all assets with notes
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
          gh release create "$RELEASE_TAG" release-assets/* --repo "$GH_REPO" --draft \
            --verify-tag --title "GraveTrail $RELEASE_TAG" --notes-file notes/release.md
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --latest
          printf 'Published [GraveTrail %s](https://github.com/%s/releases/tag/%s) from `%s`.\n' \
            "$RELEASE_TAG" "$GH_REPO" "$RELEASE_TAG" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
