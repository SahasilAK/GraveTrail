name: Publish standalone release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version X.Y.Z (must match the committed pyproject.toml and uv.lock)'
        required: true
        type: string
      copilot_notes:
        description: 'Try Copilot highlights using GITHUB_TOKEN; fall back if unavailable (uses Copilot credits)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-standalone-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.5'
          python-version: '3.11'
      - name: Validate source branch, project version and unused tag
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Publish releases only from the default branch: $DEFAULT_BRANCH"
            exit 1
          fi
          uv lock --check
          VERSION=$(uv run --locked python scripts/release.py validate "$RELEASE_VERSION")
          TAG="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "::error::Tag $TAG already exists; releases are never overwritten"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Record source and bounded commit history
        run: |
          mkdir notes
          PREVIOUS=$(git describe --tags --match 'v[0-9]*' --abbrev=0 "$GITHUB_SHA" 2>/dev/null || true)
          RANGE="$GITHUB_SHA"
          if [[ -n "$PREVIOUS" ]]; then RANGE="$PREVIOUS..$GITHUB_SHA"; fi
          printf 'Source commit: `%s`\n\nUp to 100 commits since the previous reachable version tag.\n\n' "$GITHUB_SHA" > notes/commits.md
          git log --max-count=100 --format='- %h %s' "$RANGE" >> notes/commits.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-note-inputs
          path: notes/commits.md
          if-no-files-found: error

  builds:
    needs: prepare
    uses: ./.github/workflows/release.yml
    with:
      skip_container: true

  highlights:
    if: inputs.copilot_notes
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      copilot-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.5'
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-note-inputs
          path: notes
      - name: Install pinned Copilot CLI
        run: npm install --global @github/copilot@1.0.98
      - name: Optional highlights with no tool or repository access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked python scripts/release.py summarize --commits notes/commits.md --output notes/highlights.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-highlights
          path: notes/highlights.md
          if-no-files-found: ignore

  publish:
    # An unavailable/disabled Copilot job must not block verified native builds.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.builds.result == 'success' }}
    needs: [prepare, builds, highlights]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.5'
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gravetrail-*
          path: downloaded
      - name: Verify all builds and assemble standalone release assets
        run: uv run --locked python scripts/release.py stage "$RELEASE_VERSION" --downloads downloaded --output release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-note-inputs
          path: notes
      - name: Download optional Copilot highlights
        if: needs.highlights.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-highlights
          path: notes
      - name: Generate GitHub notes and retain exact change records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA" --jq .body > notes/github.md
          uv run --locked python scripts/release.py notes --baseline notes/github.md --commits notes/commits.md --summary notes/highlights.md --output notes/release.md
      - name: Create exact source tag and publish all assets with notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
          gh release create "$RELEASE_TAG" release-assets/* --repo "$GH_REPO" \
            --verify-tag --title "GraveTrail $RELEASE_TAG" --notes-file notes/release.md
          printf 'Published [GraveTrail %s](https://github.com/%s/releases/tag/%s) from `%s`.\n' \
            "$RELEASE_TAG" "$GH_REPO" "$RELEASE_TAG" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
