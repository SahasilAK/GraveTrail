name: security

on:
  push:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan complete reachable history
        run: gitleaks git --log-opts=HEAD --config .gitleaks.toml --redact=100 --no-banner --max-archive-depth=3 .
      - name: Scan current tracked files and nested fixtures
        run: |
          git archive --format=zip HEAD --output="$RUNNER_TEMP/source.zip"
          gitleaks dir --config .gitleaks.toml --redact=100 --no-banner --max-archive-depth=3 "$RUNNER_TEMP/source.zip"

  dependencies:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.5'
          python-version: ${{ matrix.python }}
      - name: Export every locked dependency group and extra
        run: uv export --locked --all-extras --all-groups --no-emit-project --no-hashes --output-file requirements-audit.txt
      - name: Audit applicable locked versions against current advisories
        run: uvx --python "${{ matrix.python }}" --from pip-audit==2.10.1 pip-audit --disable-pip --no-deps --requirement requirements-audit.txt
