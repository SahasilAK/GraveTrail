name: release artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_container:
        description: 'Build only native distributions for the publishing workflow'
        type: boolean
        default: false
      only_windows:
        description: 'Run only the Windows native build when called from the standalone publish workflow'
        type: boolean
        default: false
      release_version:
        description: 'Resolved release version, materialized only in this build checkout'
        type: string
        default: ''
      release_mode:
        type: string
        default: development
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.only_windows && '["windows-latest"]' || '["ubuntu-24.04","windows-latest","macos-latest"]') }}
    runs-on: ${{ inputs.release_mode == 'production' && fromJSON('["self-hosted","Windows","X64","gravetrail-signing"]') || matrix.os }}
    environment: ${{ inputs.release_mode == 'production' && 'windows-production' || 'windows-development' }}
    env:
      RELEASE_VERSION: ${{ inputs.release_version }}
      RELEASE_MODE: ${{ inputs.release_mode || 'development' }}
      WINDOWS_SIGNING_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_THUMBPRINT }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
      WINDOWS_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.5'
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Materialize resolved or tag version in build checkout
        if: inputs.release_version != '' || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="$RELEASE_VERSION"
          if [[ -z "$VERSION" ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          uv run --locked python scripts/release.py materialize "$VERSION"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Build host executable and Python distributions
        run: uv run gravetrail-build --target executable
      - name: Smoke native executable
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            uv run python scripts/build/smoke.py --executable dist/.build/bundle/gravetrail/gravetrail.exe
          else
            uv run python scripts/build/smoke.py --executable dist/.build/bundle/gravetrail/gravetrail
          fi
      - name: Install wheel into clean environment
        shell: bash
        run: |
          uv venv dist/installed
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            PYTHON=dist/installed/Scripts/python.exe
          else
            PYTHON=dist/installed/bin/python
          fi
          uv pip install --python "$PYTHON" dist/python/*.whl
          uv run python scripts/build/smoke.py --python "$PYTHON"
      - name: Install checksum-pinned Inno Setup compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') { throw 'Inno Setup checksum mismatch' }
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$env:LOCALAPPDATA\GraveTrailBuildTools`"") -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
      - name: Package Windows installer with explicit trust policy
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = uv version --short
          ./scripts/build/windows_installer.ps1 -Version $version -SourceRevision '${{ github.sha }}' -Mode $env:RELEASE_MODE
      - name: Verify installed application, upgrade and uninstall preservation
        if: runner.os == 'Windows'
        run: uv run --locked python scripts/build/smoke_installer.py --directory dist --finalize
      - run: uv run gravetrail-build --verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gravetrail-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.exe
            dist/windows-verification.json
            dist/python/*
            dist/manifest.json
            dist/SHA256SUMS
          if-no-files-found: error
  container:
    if: ${{ !inputs.skip_container }}
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.5'
          python-version: '3.11'
      - name: Materialize tag version in build checkout
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: uv run --locked python scripts/release.py materialize "${GITHUB_REF_NAME#v}"
      - run: uv sync --locked --extra dev
      - run: uv run gravetrail-build --target docker
      - name: Container health and persistent runtime
        shell: bash
        run: |
          VERSION=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          docker volume create gravetrail-release-smoke
          trap 'docker rm -f gravetrail-release-smoke 2>/dev/null || true; docker volume rm gravetrail-release-smoke' EXIT
          docker run -d --name gravetrail-release-smoke -v gravetrail-release-smoke:/data -p 127.0.0.1:18501:8501 "gravetrail:$VERSION"
          for i in {1..60}; do curl -fsS http://127.0.0.1:18501/_stcore/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:18501/_stcore/health
          docker stop gravetrail-release-smoke
          docker rm gravetrail-release-smoke
          docker run --rm -v gravetrail-release-smoke:/data "gravetrail:$VERSION" gravetrail --json --allow-write workspace create release-smoke
          docker run --rm -v gravetrail-release-smoke:/data "gravetrail:$VERSION" gravetrail --json workspace list | grep release-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gravetrail-container-metadata
          path: |
            dist/docker-image.json
            dist/manifest.json
            dist/SHA256SUMS
