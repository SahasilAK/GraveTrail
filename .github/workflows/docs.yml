name: documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/docs/**'
      - 'tests/test_documentation.py'
      - '.github/workflows/docs.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.5'
          python-version: '3.11'
          enable-cache: true
      - name: Install locked documentation dependencies only
        run: uv sync --locked --only-group docs
      - name: Strict build, links and publication inventory
        run: uv run --no-sync python scripts/docs/build.py
      - name: Upload only validated static output
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
