[server]
address = "127.0.0.1"
headless = true
maxUploadSize = 100

[browser]
gatherUsageStats = false

[theme]
font = "system-ui"
baseFontSize = 16
headingFontSizes = ["2.5rem", "1.65rem", "1.2rem", "1rem", "0.9rem", "0.85rem"]
baseRadius = "0.75rem"
buttonRadius = "0.55rem"
headingFontWeights = [650, 600, 600, 600, 600, 600]
metricValueFontSize = "2rem"
metricValueFontWeight = 600
showSidebarBorder = true
showWidgetBorder = true
paddingTop = "2rem"
paddingBottom = "3rem"
base = "dark"
primaryColor = "#2869c7"
backgroundColor = "#15202e"
secondaryBackgroundColor = "#1f2e40"
textColor = "#e7eef7"
borderColor = "#3b4f65"
linkColor = "#9abcf0"
chartCategoricalColors = ["#71a7ee", "#52c5c5", "#bb9cde", "#e1ad66"]

