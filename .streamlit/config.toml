[server]
address = "127.0.0.1"
headless = true
maxUploadSize = 100

[browser]
gatherUsageStats = false

[theme]
font = "system-ui"
baseFontSize = 16
headingFontSizes = ["2.5rem", "1.65rem", "1.2rem", "1rem", "0.9rem", "0.85rem"]
baseRadius = "0.75rem"
buttonRadius = "0.55rem"
headingFontWeights = [650, 600, 600, 600, 600, 600]
metricValueFontSize = "2rem"
metricValueFontWeight = 600
showSidebarBorder = true
showWidgetBorder = true
paddingTop = "2rem"
paddingBottom = "3rem"
base = "light"
primaryColor = "#a84b2f"
backgroundColor = "#faf7f2"
secondaryBackgroundColor = "#eee7dc"
textColor = "#3d332c"
borderColor = "#d6cabb"
linkColor = "#a0482e"
chartCategoricalColors = ["#a84b2f", "#607568", "#8c7197", "#92733f"]

