[server]
address = "127.0.0.1"
headless = true
maxUploadSize = 100

[browser]
gatherUsageStats = false

[theme]
font = "sans-serif"
baseFontSize = 15
headingFontSizes = ["2rem", "1.5rem", "1.2rem", "1rem", "0.9rem", "0.85rem"]
baseRadius = "0.45rem"
showSidebarBorder = true
showWidgetBorder = true
paddingTop = "1.5rem"
base = "dark"
primaryColor = "#526171"
backgroundColor = "#1e2227"
secondaryBackgroundColor = "#2b3139"
textColor = "#edf0f4"
borderColor = "#5b6570"
linkColor = "#b6c5d6"
chartCategoricalColors = ["#b6c5d6", "#85bdc5", "#ccb08c", "#b7a4cb"]

[theme.light]
primaryColor = "#2869c7"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5fa"
textColor = "#17324d"
borderColor = "#d7e0ea"
linkColor = "#2869c7"
chartCategoricalColors = ["#2869c7", "#177e89", "#9465bb", "#b66a16"]

[theme.dark]
primaryColor = "#2869c7"
backgroundColor = "#15202e"
secondaryBackgroundColor = "#1f2e40"
textColor = "#e7eef7"
borderColor = "#3b4f65"
linkColor = "#9abcf0"
chartCategoricalColors = ["#71a7ee", "#52c5c5", "#bb9cde", "#e1ad66"]
